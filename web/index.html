<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>Firebase Seed</title>
    <!-- Apply the stored Mantine color scheme before paint to avoid a light/dark flash. -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem("mantine-color-scheme-value");
          if (v === "auto" || !v) {
            v = matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-mantine-color-scheme", v);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
